appId: com.mirslava.timerplus
productName: EventTimer
artifactName: EventTimer-${version}-Catalina.${ext}
electronVersion: 32.3.3
asar: true

directories:
  output: dist

files:
  - out/**/*
  - "!**/*.map"

mac:
  icon: resources/icon.png
  category: public.app-category.productivity
  executableName: EventTimer
  identity: "-"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: "10.15.0"
  extendInfo:
    CFBundleDisplayName: EventTimer
  target:
    - target: dmg
      arch:
        - x64

dmg:
  title: EventTimer Catalina
  format: UDZO
